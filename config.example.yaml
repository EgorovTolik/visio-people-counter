# =============================================================================
# visio-people-counter — ШАБЛОН КОНФИГУРАЦИИ
# -----------------------------------------------------------------------------
# Скопируйте этот файл в config.yaml и подстройте под свою камеру:
#     cp config.example.yaml config.yaml
#
# Все координаты в этом файле заданы в НОРМИРОВАННЫХ единицах 0..1 (доля от
# ширины/высоты кадра), поэтому конфиг переживает смену разрешения камеры.
# Быстрый способ получить координаты линии/зоны — режим калибровки:
#     python -m visio_people_counter calibrate --video videos/demo.mp4
#   он нарисует кадр и позволит рисовать линию/зону мышью, а результат
#   запишет прямо в config.yaml.
# =============================================================================

video:
  # ---------------------------------------------------------------------------
  # Источник видео. Поддерживаются два типа:
  #   type: file — локальный файл (mp4/avi/mkv...)
  #   type: hls  — HLS-поток по URL (.m3u8)
  # ---------------------------------------------------------------------------
  type: file                 # "file" | "hls"
  path: videos/demo.mp4      # путь к файлу ИЛИ URL потока (для hls)
                             # пример для hls: https://cam.example.com/live/stream.m3u8

  # Для HLS-потока поток декодируется через внешний ffmpeg (процесс + pipe).
  # Задержки не оптимизируются (по ТЗ не важны), зато есть watchdog
  # переподключения при обрывах.
  hls:
    reconnect_attempts: 0     # сколько раз пытаться переподключиться после обрыва;
                              # 0 = бесконечно (рекомендация для стрима);
                              # -1 = не переподключаться (после обрыва поток считается исчерпанным)
    reconnect_backoff_s: 5.0  # пауза между попытками, сек
    bad_read_threshold: 10    # сколько подряд неудачных read() считать обрывом

  # Для файлов: после EOF программа корректно завершится с финальной сводкой.
  loop_file: false            # true = зациклить файл (удобно для тестов GUI-режима)

processing:
  # ---------------------------------------------------------------------------
  # Параметры обработки кадров.
  # ---------------------------------------------------------------------------
  effective_fps: 0            # fps, с которым брать кадры из источника.
                              # 0 = нативный fps источника (рекомендация для файлов).
                              # Для HLS разумно 10-15: меньше нагрузка, для подсчёта
                              # трафика точность та же. Пример: effective_fps: 12
  max_width: 0                # даунскейл кадров до указанной ширины (px); 0 = как в источнике.
                              # Обработка 1280px заметно быстрее, а для счёта людей
                              # на уличной камере обычно достаточно. Пример: max_width: 1280

  # Интервал КАДРОВ, в котором работают трекер и счётчики (детектор обрабатывает
  # ВСЕ кадры — модель фона MOG2 должна обучиться до начала интервала). Номера
  # кадров 0-based (как индекс кадра в OpenCV/GUI; номер виден в статусе калибратора),
  # frame_end — включительно. null/отсутствует = без границы: ничего не задано →
  # весь видео; только frame_start → с него до конца; только frame_end → от начала
  # до него включительно.
  # Пример: подсчёт только в кадрах 100–250:
  #   frame_start: 100
  #   frame_end: 250
  frame_start: null           # первый кадр подсчёта (0-based, включительно); null = с первого
  frame_end: null             # последний кадр подсчёта (0-based, включительно); null = до последнего

motion:
  # ---------------------------------------------------------------------------
  # Выделение движения (background subtraction).
  # Методы:
  #   mog2 — смесь гауссианов; быстрее, умеет выделять тени. БАЗОВЫЙ выбор.
  #   knn  — K-ближайших соседей по цвету; часто чуть точнее на жёстких границах,
  #          но медленнее и без теневой маски. Для A/B-экспериментов.
  # ---------------------------------------------------------------------------
  method: mog2                # "mog2" | "knn"

  history: 500                # глубина модели фона в кадрах (~сколько кадров нужно
                              # чтобы «впечатать» новый фон). Не выкручивайте слишком
                              # высоко: медленная адаптация к смене освещения.
  var_threshold: 32           # (mog2) чувствительность: чем БОЛЬШЕ, тем МЕНЬШЕ
                              # ложных срабатываний (ветки, мерцание), но дальние
                              # мелкие объекты могут не засветиться. Диапазон 16-64.
  dist2_threshold: 4.0        # (knn) аналог var_threshold для KNN; типично 1.0-6.0
  detect_shadows: true        # (mog2) помечать тени отдельным значением в маске.
                              # true + shadow_threshold ниже — тени отбрасываются явно.
                              # false — тени выглядят как движение и режутся морфологией.
  shadow_threshold: 200       # (mog2, при detect_shadows=true) пиксели маски со
                              # значением < этого порога считаются тенью и отбрасываются.
                              # Диапазон обычно 130-250; 200 — проверенное типичное.

  # Морфологическая постобработка маски (ядра в px, размеры нечётные):
  morph_open: [3, 3]          # OPEN первым: удаляет шумовые «соли» (дождь, комары).
                              # Увеличьте до [5,5]-[7,7], если много мелкого шума.
  morph_close: [9, 15]        # CLOSE вторым: склеивает разорванные части тела
                              # (голова+тело), «заполняет» дыры в blob'е. Ядро
                              # вытянутое по вертикали — человек вертикальный объект.

objects:
  # ---------------------------------------------------------------------------
  # Фильтры обнаруженных движущихся объектов (без классификации — отбрасываем
  # незначащие события: шум, машины, облака теней). Все размеры — в px обработанного
  # кадра; area — доля площади кадра (0..1) для масштабируемости.
  # ---------------------------------------------------------------------------
  min_area_fraction: 0.0005   # мин. площадь blob'а как доля площади кадра.
                              # 0.0005 на 1280x720 ≈ 460 px² — небольшой дальний человек.
                              # Поднимите (0.001-0.005), если шумит дальний план.
  max_area_fraction: 0.25     # макс. площадь blob'а; режет машины, огромные тени,
                              # «полосы» при качке камеры. Типично 0.15-0.35.
  min_bbox_side_px: 8         # мин. сторона bbox (px); блокирует субпиксельный мусор.
  aspect_ratio_range: [0.2, 2.5]   # допустимый w/h bbox'а. Человек ≈ 0.3-1.0;
                              # широкий диапазон ставим, чтобы не резать дальних/идущих
                              # в профиль. Узкий диапазон (например [0.3, 1.2]) — если
                              # нужно отфильтровать машины (у них w/h ~ 1.5-4).
  min_fill: 0.25              # мин. заполнение bbox'а: area/(w*h). Человек ~0.3-0.6;
                              # россыпь шума/ветка — << 0.3.
  min_lifetime_frames: 3      # подтверждённый трек попадает в счётчики только после
                              # наблюдения минимум N кадров подряд (анти-вспышка и
                              # антидубль короткоживущих треков). Применяется конвейером.

size_profile:
  # ---------------------------------------------------------------------------
  # Адаптация к разному РАЗМЕРУ объектов (широкий угол: дальний человек в 10-30 раз
  # меньше ближнего). Опциональный блок: если пуст/отсутствует — работает глобальный
  # min_area_fraction из блока objects.
  #
  # Как пользоваться:
  #   control_points — точки КАДРА (x и y в долях 0..1) и ожидаемая ВЫСОТА ЧЕЛОВЕКА
  #   в этой точке, в долях высоты кадра; формат [x, y, h]. Пример: [0.1, 0.9, 0.45]
  #   означает «в левом нижнем углу кадра человек занимает 45% его высоты» (ближний
  #   план), а [0.9, 0.35, 0.08] — «у дальнего края, в верхней трети кадра, человек
  #   всего 8% высоты». Поверхность h(x, y) нужна для вертикальной/диагональной
  #   перспективы: рост зависит и от x, и от y (глубины). Фит по точкам: n>=4 —
  #   a + b·x + c·y + d·x·y; 3 точки — плоскость; 2 — интерполяция вдоль отрезка;
  #   1 — константа. Старые пары [x, h] читаются с миграцией y=0.5 (warning в stdout).
  #   Совет: калибруйте 3-5 точек по всей сцене, где реально стоят/идут люди.
  #   k_min / k_max — множители: min_area = k_min * h_px^2, max_area = k_max * h_px^2
  #   (h_px — высота человека в px в точке объекта). Человек заполняет bbox'ом
  #   ~0.4-0.6 своей площади silhouettes; k_min=0.15..0.3, k_max=3..6 типично.
  #
  # В режиме calibrate точки выставляются мышью (клик запоминает и x, и y;
  # цифра 1-9 задаёт высоту): «вертикальная мерка роста» ставится в нескольких
  # местах кадра, где реально стоят/идут люди.
  # ---------------------------------------------------------------------------
  enabled: false
  control_points: []          # список троек [x_fraction, y_fraction, person_height_fraction]
                              # пример для уличной камеры (ближе к камере — внизу):
                              #   control_points:
                              #     - [0.10, 0.95, 0.45]
                              #     - [0.35, 0.75, 0.25]
                              #     - [0.60, 0.55, 0.14]
                              #     - [0.85, 0.40, 0.09]
  k_min: 0.2
  k_max: 4.0

tracker:
  # ---------------------------------------------------------------------------
  # Трекер движения (вспомогательный механизм: даёт устойчивые track_id, чтобы
  # один объект не был посчитан дважды). Реализация — пакет `trackers`
  # (roboflow, Apache-2.0), работает на CPU без GPU.
  # ---------------------------------------------------------------------------
  type: sort                  # "sort" | "bytetrack" | "botsort"
                              # sort      — базовый выбор для нас (Kalman + IoU-матчинг);
                              # bytetrack — аналогичный по качеству, берёт на себя слабые
                              #              детекции; при наших blob'ах без confidence
                              #              работает как SORT;
                              # botsort    — аналог SORT + двухстадийная ассоциация;
                              #              CMC (компенсация качки камеры) у нас не активен
                              #              (трекеру не передаются кадры), поэтому на blob'ах
                              #              ведёт себя как SORT.
  lost_track_buffer: 60       # сколько КАДРОВ помнить пропавший объект перед закрытием трека.
                              # Масштабируется по effective_fps (60 кадров при 15 fps = 4 c).
                              # Меньше — быстрее «списываются» мусорные треки; больше —
                              # лучше переживают перекрытия людей. Диапазон 30-120.
  minimum_consecutive_frames: 2   # сколько кадров подряд blob должен жить, чтобы трек стал
                              # «подтверждённым» и попал в подсчёт. 2-3 типично.
  minimum_iou_threshold: 0.3      # мин. пересечение bbox'ов (IoU) для связывания det→track.
                              # 0.1-0.5; выше — меньше ложных треков от шума, но хуже
                              # связь при быстром движении/пропуске кадров.

counters:
  # ---------------------------------------------------------------------------
  # Счётчики. Можно задать НЕСКОЛЬКО, разных типов и в разных местах кадра —
  # события каждого логируются отдельно (поле counter_id).
  #
  #   type: line — линия пересечения. Точки A → B задают направление «in»:
  #               объект, прошедший линию по вектору A→B, считается "in",
  #               в обратную сторону — "out". Рисуется от «входа» к «выходу».
  #   type: zone — полигон (зона). Вводите контур из точек; направление задаётся
  #               порядком обхода: объект, входящий в зону снаружи, = "in",
  #               выходящий наружу = "out".
  #
  # count_mode:
  #   both    — отдельно in и out (рекомендация)
  #   total   — общий счёт без разделения направлений
  # ---------------------------------------------------------------------------
  - id: main_line
    type: line
    a: [0.25, 0.35]           # точка A (x, y), доли кадра — начало линии
    b: [0.75, 0.85]           # точка B — конец линии; направление A→B = "in"
    count_mode: both          # "both" | "total"

    # --- антидвойной-счёт (антидубль) -------------------------------------
    cooldown_s: 2.0           # после засчитанного пересечения этот track_id не
                              # считается повторно в течение N секунд
    buffer_width_scale: 0.75  # «буфер» вокруг линии, ширина = scale * высоте человека
                              # в точке пересечения (из size_profile). Объект должен
                              # выйти из буфера, чтобы его повторный проход засчитали.
    min_global_gap_s: 0.3     # мин. интервал между ЛЮБЫМИ событиями этого счётчика —
                              # режет сдвоенные blob'ы одного человека (голова+тело).

  - id: entry_zone            # пример зоны (закомментировать, если не нужна)
    type: zone
    polygon:                  # контур полигона в долях кадра, по часовой стрелке
      - [0.55, 0.60]
      - [0.95, 0.60]
      - [0.95, 0.95]
      - [0.55, 0.95]
    count_mode: total
    cooldown_s: 3.0
    min_global_gap_s: 0.3

output:
  # ---------------------------------------------------------------------------
  # Где и как писать результаты.
  # ---------------------------------------------------------------------------
  events_jsonl: results/events.jsonl   # лог событий: по одной JSON-строке на пересечение
                                       # (track_id, counter_id, direction, t_video, координаты...)
                                       # "" = не писать
  report_path: ""                     # markdown-отчёт с итогами по счётчикам и таблицей событий.
                                      # "" = автопуть рядом с видео <видео>.report.md (только для файла);
                                      # для HLS/URL автоотчёта нет — задайте путь явно, напр. reports/run.md
  summary_interval_s: 30               # печатать промежуточную сводку (in/out/total)
                                       # в stdout каждые N секунд; 0 = только финал
  final_summary: true                  # печатать итоговую сводку при завершении
                                       # (EOF файла / SIGINT для стрима)

debug:
  # ---------------------------------------------------------------------------
  # Отладочная визуализация (блоки show_* работают в GUI-режиме --gui;
  # save_debug_frames_dir работает и в headless'е).
  # ---------------------------------------------------------------------------
  show_bboxes: true           # рисовать bbox подтверждённых треков с track_id
  show_all_blobs: false       # рисовать ВСЕ необработанные blob'ы (до трекера) —
                              # видно, что отфильтровано; полезно при калибровке
  show_mask: false            # миксовать кадр с маской движения (50%)
  show_counters: true         # рисовать линии/зоны и текущие счётчики in/out
  save_debug_frames_dir: ""   # если задать папку — сохранять отладочные кадры туда
                              # (напр. debug/) каждый N-й кадр (debug_frame_step);
                              # headless: обработанный кадр; --gui: кадр с overlay

  debug_frame_step: 10        # шаг сохранения отладочных кадров (каждый N-й)
